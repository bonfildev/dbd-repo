<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>WANails Agenda</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://images.unsplash.com/photo-1500839941678-aae14dbfae9a');
      background-size: cover;
      background-position: center;
      margin: 0;
      padding: 0;
      backdrop-filter: blur(4px);
    }
    header {
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
      padding: 1rem;
      font-size: 2rem;
      font-weight: bold;
    }
    .tab-container {
      display: flex;
      justify-content: center;
      background: #f0f0f0;
    }
    .tab {
      padding: 1rem 2rem;
      cursor: pointer;
      background: #ddd;
      border: 1px solid #bbb;
    }
    .tab.active {
      background: #fff;
      border-bottom: none;
    }
    .content {
      display: none;
      background: rgba(255, 255, 255, 0.9);
      padding: 1rem;
      max-width: 900px;
      margin: 1rem auto;
      border-radius: 10px;
    }
    .content.active {
      display: block;
    }
    .button-row {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-add { background: #28a745; }
    .btn-export { background: #007bff; }
    .btn-delete { background: #dc3545; }
    .btn-import { background: #ffc107; color: black; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 8px;
      border: 1px solid #bbb;
      text-align: left;
    }
    th {
      background: #333;
      color: white;
    }
    tr:nth-child(even) {
      background: #f2f2f2;
    }
    tr:nth-child(odd) {
      background: #ffffff;
    }

    /* Highlight add row */
    .add-row {
      background: #d4f8d4 !important; /* light green */
    }

    input[type="datetime-local"],
    input[type="text"],
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      border: none;
      background: transparent;
    }

    input:focus {
      outline: 1px solid #007bff;
      background: #eaf3ff;
    }

    #calendarContainer {
      display: inline-block;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>WANails Agenda</header>

  <!-- Tabs -->
  <div class="tab-container">
    <div class="tab active" onclick="openTab('database')">Base de Datos</div>
    <div class="tab" onclick="openTab('resume')">Resumen</div>
  </div>

  <!-- Base de Datos -->
  <div id="database" class="content active">
    <div class="button-row">
      <button class="btn-export" onclick="exportarExcel()">Exportar</button>
      <input type="file" id="fileInput" style="display:none" onchange="importarExcel(event)">
      <button class="btn-import" onclick="document.getElementById('fileInput').click()">Importar</button>
    </div>

    <!-- Add row at top -->
    <table>
      <thead>
        <tr>
          <th>Fecha y Hora</th>
          <th>Asunto</th>
          <th>Anticipo $</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr class="add-row">
          <td><input type="datetime-local" id="newFecha"></td>
          <td><input type="text" id="newAsunto" placeholder="Escribe un asunto"></td>
          <td><input type="number" id="newAnticipo" placeholder="0"></td>
          <td><button class="btn-add" onclick="addNewItem()">Agregar</button></td>
        </tr>
      </tbody>
    </table>

    <!-- Existing records -->
    <table id="dataTable">
      <tbody></tbody>
    </table>
  </div>

  <!-- Resumen -->
  <div id="resume" class="content">
    <div id="calendarContainer">
      <input type="text" id="calendarFilter" placeholder="Selecciona fecha...">
    </div>
    <table id="resumeTable">
      <thead>
        <tr>
          <th>Fecha y Hora</th>
          <th>Asunto</th>
          <th>Anticipo $</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let data = JSON.parse(localStorage.getItem('agendaData')) || [];
    const dataTable = document.getElementById('dataTable').querySelector('tbody');
    const resumeTable = document.getElementById('resumeTable').querySelector('tbody');

    function openTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabName).classList.add('active');
    }

    function addNewItem() {
      const fecha = document.getElementById('newFecha').value;
      const asunto = document.getElementById('newAsunto').value;
      const anticipo = document.getElementById('newAnticipo').value;
      if (!fecha || !asunto) return alert("Por favor, completa Fecha y Asunto");
      data.push({ fecha, asunto, anticipo });
      saveData();
      renderTable();
      document.getElementById('newFecha').value = '';
      document.getElementById('newAsunto').value = '';
      document.getElementById('newAnticipo').value = '';
    }

    function deleteRow(index) {
      data.splice(index, 1);
      saveData();
      renderTable();
    }

    function saveData() {
      localStorage.setItem('agendaData', JSON.stringify(data));
    }

    function renderTable() {
      dataTable.innerHTML = '';
      data.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><input type="datetime-local" value="${item.fecha}" onchange="updateField(${index}, 'fecha', this.value)"></td>
          <td><input type="text" value="${item.asunto}" onchange="updateField(${index}, 'asunto', this.value)"></td>
          <td><input type="number" value="${item.anticipo}" onchange="updateField(${index}, 'anticipo', this.value)"></td>
          <td><button class="btn-delete" onclick="deleteRow(${index})">Eliminar</button></td>
        `;
        dataTable.appendChild(row);
      });
    }

    function updateField(index, field, value) {
      data[index][field] = value;
      saveData();
    }

    function exportarExcel() {
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Agenda");
      XLSX.writeFile(wb, "WANails_Agenda.xlsx");
    }

    function importarExcel(event) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = (e) => {
        const workbook = XLSX.read(e.target.result, { type: 'binary' });
        const firstSheet = workbook.SheetNames[0];
        const excelData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
        data = excelData.map(row => ({
          fecha: row['Fecha y Hora'] || '',
          asunto: row['Asunto'] || '',
          anticipo: row['Anticipo $'] || ''
        }));
        saveData();
        renderTable();
      };
      reader.readAsBinaryString(file);
    }

    flatpickr("#calendarFilter", {
      dateFormat: "Y-m-d",
      onChange: function(selectedDates, dateStr) {
        filterByDate(dateStr);
      }
    });

    function filterByDate(dateStr) {
      resumeTable.innerHTML = '';
      data.filter(item => item.fecha.startsWith(dateStr)).forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.fecha}</td>
          <td>${item.asunto}</td>
          <td>${item.anticipo}</td>
        `;
        resumeTable.appendChild(row);
      });
    }

    renderTable();
  </script>
</body>
</html>
